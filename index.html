<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Base UI | Pure Intelligence</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="bg-texture"></div> <div class="bg-glow"></div>

  <header class="main-header">
    <div class="brand-wrapper">
      <div class="brand-logo">
        <svg viewBox="0 0 100 100">
          <path id="logoPath" d="M50,50 m-35,0 a35,35 0 1,1 70,0 a35,35 0 1,1 -70,0" fill="none" />
          <text><textPath href="#logoPath">BASE UI • SYSTEM • PREMIUM • INTELLIGENCE</textPath></text>
        </svg>
      </div>
      <span class="brand-name">BASE UI</span>
    </div>
    <nav class="header-nav">
      <span class="status-pill"><span class="dot"></span> Gemini Active</span>
    </nav>
  </header>

  <main class="apple-container">
    <section class="hero-section reveal">
      <div class="badge">Powered by Google Gemini</div>
      <h1 class="hero-title">AI Precision.<br><span class="thin">Zero Overhead.</span></h1>
      <p class="hero-subtitle">Masukkan teks di bawah untuk diringkaskan oleh AI.</p>
      
      <div class="input-wrapper">
        <textarea id="userInput" class="glass-input" placeholder="Paste your text here to summarize..."></textarea>
      </div>

      <button class="apple-btn" onclick="startAI()">
        <span>Generate AI Summary</span>
      </button>
    </section>

    <section class="glass-bento reveal">
      <div class="glass-card">
        <div class="ai-output" id="aiOutput">
          <div class="ai-status">
            <p class="ai-line">● Connecting to Gemini...</p>
            <p class="ai-line">● Analyzing context...</p>
            <p class="ai-line">● Generating summary...</p>
          </div>

          <div class="ai-result">
            <div class="result-header">
              <span class="sparkle">✦</span>
              <h3>Executive Summary</h3>
            </div>
            <p id="typedText"></p>
          </div>
        </div>
        <div class="card-footer">Powered by Base UI Engine v2.0</div>
      </div>
    </section>
  </main>

  <script>
    // 1. MASUKKAN KEY BARU DARI GOOGLE CLOUD (CREDENTIALS)
    const API_KEY = "AIzaSyAiqhYrJmTtTAlZQggq_OEKarxzdUd8esk"; 

    // --- ANIMASI ---
    function reveal() {
      var reveals = document.querySelectorAll(".reveal");
      reveals.forEach((element) => {
        var windowHeight = window.innerHeight;
        var elementTop = element.getBoundingClientRect().top;
        if (elementTop < windowHeight - 150) {
          element.classList.add("active");
        }
      });
    }
    window.addEventListener("scroll", reveal);
    document.addEventListener("DOMContentLoaded", reveal);

    // --- FUNGSI PINTAR: CARI MODEL DULU ---
    async function getAvailableModel() {
        try {
            // Tanya Google: "Apa model yang saya boleh guna?"
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`);
            const data = await response.json();
            
            if (!data.models) return "gemini-1.5-flash"; // Fallback kalau gagal check

            // Cari model yang paling sesuai (Flash atau Pro)
            const flashModel = data.models.find(m => m.name.includes("gemini-1.5-flash"));
            const proModel = data.models.find(m => m.name.includes("gemini-pro"));
            
            // Kita utamakan Flash sebab laju, kalau takde baru guna Pro
            if (flashModel) return flashModel.name.replace("models/", "");
            if (proModel) return proModel.name.replace("models/", "");
            
            return "gemini-1.5-flash"; // Default

        } catch (e) {
            console.error("Gagal check model:", e);
            return "gemini-1.5-flash"; // Guna default je kalau error
        }
    }

    // --- LOGIK UTAMA ---
    async function startAI() {
      const inputField = document.getElementById("userInput");
      const userText = inputField.value.trim();
      const outputContainer = document.getElementById("typedText");
      const card = document.querySelector(".glass-card");

      if (!userText) {
        alert("Sila masukkan teks dahulu!");
        return;
      }
      
      // UI Loading
      card.style.borderColor = "rgba(0, 113, 227, 0.6)";
      document.body.classList.add("ai-running");
      document.body.classList.remove("ai-done");
      outputContainer.innerHTML = "Mencari model AI terbaik..."; 

      try {
        // 1. Dapatkan nama model yang sah untuk akaun ini
        const modelName = await getAvailableModel();
        outputContainer.innerHTML = `Menghubungi ${modelName}...`;

        // 2. Hantar Request
        console.log(`Menggunakan model: ${modelName}`);
        
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "Summarize this: " + userText }] }]
          })
        });

        // 3. Cek Error
        if (!response.ok) {
           const errorData = await response.json();
           throw new Error(`Google Error (${response.status}): ${errorData.error.message}`);
        }

        const data = await response.json();
        
        if (!data.candidates || data.candidates.length === 0) {
            throw new Error("AI tidak memberikan jawapan.");
        }

        const aiSummary = data.candidates[0].content.parts[0].text;

        // 4. Berjaya
        document.body.classList.remove("ai-running");
        document.body.classList.add("ai-done");
        card.style.borderColor = "rgba(255, 255, 255, 0.1)";
        
        typeWriter(outputContainer, aiSummary, 0);

      } catch (error) {
        console.error("ERROR:", error);
        document.body.classList.remove("ai-running");
        document.body.classList.add("ai-done");
        
        // Papar error di skrin supaya tak perlu buka console
        outputContainer.innerHTML = `
          <div style="color: #ff6b6b; font-weight: bold; margin-bottom: 10px;">⚠️ MASALAH DITEMUI</div>
          <div style="font-size: 0.9em; color: #ccc;">${error.message}</div>
          <br>
          <div style="font-size: 0.8em; color: #888;">Tips: Pastikan Key diambil dari tab 'Credentials' dalam projek yang sama anda Enable API tadi.</div>
        `;
      }
    }

    function typeWriter(element, text, i) {
      if (i < text.length) {
        element.innerHTML += text.charAt(i);
        let speed = text.charAt(i) === "." ? 200 : 20;
        setTimeout(() => typeWriter(element, text, i + 1), speed);
      }
    }
  </script>
</body>
</html>

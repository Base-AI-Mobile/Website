<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Base UI | Pure Intelligence</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="bg-texture"></div> <div class="bg-glow"></div>

  <header class="main-header">
    <div class="brand-wrapper">
      <div class="brand-logo">
        <svg viewBox="0 0 100 100">
          <path id="logoPath" d="M50,50 m-35,0 a35,35 0 1,1 70,0 a35,35 0 1,1 -70,0" fill="none" />
          <text><textPath href="#logoPath">BASE UI • SYSTEM • PREMIUM • INTELLIGENCE</textPath></text>
        </svg>
      </div>
      <span class="brand-name">BASE UI</span>
    </div>
    <nav class="header-nav">
      <span class="status-pill"><span class="dot"></span> Gemini Active</span>
    </nav>
  </header>

  <main class="apple-container">
    <section class="hero-section reveal">
      <div class="badge">Powered by Google Gemini</div>
      <h1 class="hero-title">AI Precision.<br><span class="thin">Zero Overhead.</span></h1>
      <p class="hero-subtitle">Masukkan teks di bawah untuk diringkaskan oleh AI.</p>
      
      <div class="input-wrapper">
        <textarea id="userInput" class="glass-input" placeholder="Paste your text here to summarize..."></textarea>
      </div>

      <button class="apple-btn" onclick="startAI()">
        <span>Generate AI Summary</span>
      </button>
    </section>

    <section class="glass-bento reveal">
      <div class="glass-card">
        <div class="ai-output" id="aiOutput">
          <div class="ai-status">
            <p class="ai-line">● Connecting to Gemini...</p>
            <p class="ai-line">● Analyzing context...</p>
            <p class="ai-line">● Generating summary...</p>
          </div>

          <div class="ai-result">
            <div class="result-header">
              <span class="sparkle">✦</span>
              <h3>Executive Summary</h3>
            </div>
            <p id="typedText"></p>
          </div>
        </div>
        <div class="card-footer">Powered by Base UI Engine v2.0</div>
      </div>
    </section>
  </main>

  <script>
    // ⚠️ MASUKKAN KEY BARU DARI GOOGLE CLOUD ANDA
    const API_KEY = "AIzaSyAiqhYrJmTtTAlZQggq_OEKarxzdUd8esk"; 

    // --- ANIMASI ---
    function reveal() {
      var reveals = document.querySelectorAll(".reveal");
      reveals.forEach((element) => {
        var windowHeight = window.innerHeight;
        var elementTop = element.getBoundingClientRect().top;
        if (elementTop < windowHeight - 150) {
          element.classList.add("active");
        }
      });
    }
    window.addEventListener("scroll", reveal);
    document.addEventListener("DOMContentLoaded", reveal);

    // --- FUNGSI PINTAR: CUBA MODEL SATU PER SATU ---
    async function tryGenerate(userText, modelName) {
        console.log(`Mencuba model: ${modelName}...`);
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "Summarize this: " + userText }] }]
          })
        });

        if (!response.ok) {
           const errorData = await response.json();
           throw new Error(errorData.error.message || response.statusText);
        }
        return await response.json();
    }

    // --- LOGIK UTAMA ---
    async function startAI() {
      const inputField = document.getElementById("userInput");
      const userText = inputField.value.trim();
      const outputContainer = document.getElementById("typedText");
      const card = document.querySelector(".glass-card");

      if (!userText) {
        alert("Sila masukkan teks dahulu!");
        return;
      }
      
      // UI Loading
      card.style.borderColor = "rgba(0, 113, 227, 0.6)";
      document.body.classList.add("ai-running");
      document.body.classList.remove("ai-done");
      outputContainer.innerHTML = "Menghubungi Google Gemini..."; 

      // Senarai model PERCUMA yang kita akan cuba ikut urutan
      const safeModels = ["gemini-1.5-flash", "gemini-1.5-flash-latest", "gemini-1.0-pro", "gemini-pro"];
      
      let finalSummary = "";
      let success = false;
      let lastError = "";

      for (const model of safeModels) {
          try {
              outputContainer.innerHTML = `Mencuba model: ${model}...`;
              const data = await tryGenerate(userText, model);
              
              if (data.candidates && data.candidates.length > 0) {
                  finalSummary = data.candidates[0].content.parts[0].text;
                  success = true;
                  break; // Berjaya! Keluar dari loop
              }
          } catch (e) {
              console.warn(`Gagal dengan ${model}:`, e.message);
              lastError = e.message;
              // Sambung ke model seterusnya...
          }
      }

      // HASIL
      document.body.classList.remove("ai-running");
      document.body.classList.add("ai-done");
      
      if (success) {
          card.style.borderColor = "rgba(255, 255, 255, 0.1)";
          typeWriter(outputContainer, finalSummary, 0);
      } else {
          // Jika semua model gagal
          console.error("Semua model gagal.");
          outputContainer.innerHTML = `
            <div style="color: #ff6b6b; font-weight: bold;">⚠️ SEMUA MODEL GAGAL</div>
            <div style="font-size: 0.9em; color: #ccc;">Last Error: ${lastError}</div>
            <br><small>Sila pastikan API Key betul dan 'Generative Language API' di-enable.</small>
          `;
      }
    }

    function typeWriter(element, text, i) {
      if (i < text.length) {
        element.innerHTML += text.charAt(i);
        let speed = text.charAt(i) === "." ? 200 : 20;
        setTimeout(() => typeWriter(element, text, i + 1), speed);
      }
    }
  </script>
</body>
</html>
